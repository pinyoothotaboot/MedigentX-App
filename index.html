<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediGentX Web - AI Medical Platform</title>
    <meta name="description" content="AI-Powered Medical Documentation Platform" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Robust Polyfills for Browser Environment
      window.global = window;
      
      // Polyfill process
      window.process = window.process || {
        env: {
          NODE_ENV: 'production',
          API_KEY: '' // Prevent undefined access
        },
        version: '',
        nextTick: function(cb) { setTimeout(cb, 0); }
      };

      // Polyfill Buffer (minimal implementation often required by deps)
      window.Buffer = window.Buffer || {
        isBuffer: function() { return false; },
        from: function(str) { 
          if (typeof str === 'string') return new TextEncoder().encode(str); 
          return []; 
        },
        alloc: function() { return []; }
      };
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              medical: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              },
              slate: {
                850: '#151f32', // Custom dark bg
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      .typing-cursor::after {
        content: '▋';
        animation: blink 1s step-start infinite;
        margin-left: 2px;
        color: #0ea5e9;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react-redux": "https://aistudiocdn.com/react-redux@^9.2.0",
    "@reduxjs/toolkit": "https://aistudiocdn.com/@reduxjs/toolkit@^2.11.0",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
  </body>
</html>
